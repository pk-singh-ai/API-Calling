<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="p32.css">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >
</head>
<body>
    <div class="container">
        <input type="checkbox" id="cheak" aria-label="Toggle navigation menu">
        <div class="btn_one">

            </label>
        </div>

        <div class="sidebar">
            <div class="sidebar-header">
                <a href="#">Welcome</a>
                <label for="cheak" aria-label="Close navigation menu" class="btn_two">
                    <i class="fa-solid fa-xmark"></i>
                </label>
            </div>

            <div class="menu">
                <ul>
                    <li>
                        <i class="fa-solid fa-images"></i>
                        <a href="#">Gallery</a>
                    </li>
                    <li>
                        <i class="fa-solid fa-square-up-right"></i>
                        <a href="#">Portfolio</a>
                    </li>
                    <li>
                        <i class="fa-solid fa-layer-group"></i>
                        <a href="#">Services</a>
                    </li>
                    <li>
                        <i class="fa-solid fa-circle-info"></i>
                        <a href="#">About</a>
                    </li>
                    <li>
                        <i class="fa-regular fa-circle-question"></i>
                        <a href="#">FAQ</a>
                    </li>
                    <li>
                        <i class="fa-solid fa-gear"></i>
                        <a href="#">Setting</a>
                    </li>
                    <li>
                        <i class="fa-regular fa-circle-user"></i>
                        <a href="#">Profile</a>
                    </li>
                    <li>
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <a href="#">Logout</a>
                    </li>
                </ul>
            </div>
            <div class="social">
                <i class="fa-brands fa-square-facebook"> <a href="#" target="_blank"></a> </i>
                <i class="fa-brands fa-square-twitter"> <a href="#" target="_blank"></a> </i>
                <i class="fa-brands fa-square-instagram"> <a href="#" target="_blank"></a> </i>
            </div>
                
        </div>
    </div>

</html>
